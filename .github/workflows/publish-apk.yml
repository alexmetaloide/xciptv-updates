name: Publish signed Android APK

on:
  push:
    branches: [main]
    paths: ['release.json', 'apks/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-public-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify file and publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish-release.py
