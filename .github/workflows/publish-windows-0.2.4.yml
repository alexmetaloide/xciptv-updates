name: Publish MTPLAYER Windows

on:
  push:
    branches:
      - "windows-release-0.2.4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-mtplayer-windows-0.2.4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout staged release
        uses: actions/checkout@v4

      - name: Validate staged assets
        id: assets
        shell: pwsh
        run: |
          $asset = Get-Item "windows-staging/MTPLAYER-Portable-0.2.4.exe"
          $shaFile = Get-Item "windows-staging/MTPLAYER-Portable-0.2.4.exe.sha256"
          $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
          $declared = ((Get-Content -LiteralPath $shaFile.FullName -Raw).Trim().Split(" ")[0]).ToUpperInvariant()
          if ($hash -ne $declared) {
            throw "SHA-256 mismatch for staged MTPLAYER executable."
          }
          "asset=$($asset.FullName)" >> $env:GITHUB_OUTPUT
          "sha_file=$($shaFile.FullName)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Publish official GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: windows-v0.2.4
          RELEASE_TITLE: MTPLAYER Windows 0.2.4
          SOURCE_COMMIT: ea92e075a871b33d1c76d8d870f13108e4b9a4d3
          SHA256: ${{ steps.assets.outputs.sha256 }}
          ASSET: ${{ steps.assets.outputs.asset }}
          SHA_FILE: ${{ steps.assets.outputs.sha_file }}
        run: |
          $notes = @"
          MTPLAYER para Windows 64-bit — versão portátil 0.2.4.

          - Produto: MTPLAYER
          - Plataforma: Windows x64
          - Formato: executável portátil
          - Código-fonte: alexmetaloide/xciptv@$env:SOURCE_COMMIT
          - SHA-256: $env:SHA256
          "@

          if (gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" 2>$null) {
            gh release upload "$env:RELEASE_TAG" "$env:ASSET" "$env:SHA_FILE" --clobber --repo "$env:GITHUB_REPOSITORY"
            gh release edit "$env:RELEASE_TAG" --title "$env:RELEASE_TITLE" --notes "$notes" --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create "$env:RELEASE_TAG" "$env:ASSET" "$env:SHA_FILE" --target main --title "$env:RELEASE_TITLE" --notes "$notes" --repo "$env:GITHUB_REPOSITORY"
          }

      - name: Remove temporary staging branch
        if: success()
        shell: pwsh
        run: |
          git push origin --delete "$env:GITHUB_REF_NAME"
